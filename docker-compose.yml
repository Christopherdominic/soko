services:
  postgres:
    image: postgres:16-alpine
    container_name: soko-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-soko}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-soko}
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - soko-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-soko} -d ${POSTGRES_DB:-soko}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  soko-pgdata:
